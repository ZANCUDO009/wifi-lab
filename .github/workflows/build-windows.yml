name: Crear instalador de Windows (.exe)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install
      - name: Construir .exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Guardar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: Wi-Fi-Lab-Windows
          path: |
            dist/*.exe
      - name: Publicar en Releases (solo con etiqueta)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
